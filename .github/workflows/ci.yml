name: CI

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # Subscriber-capture tests share tracing callsite state; each test still
        # exercises its own Tokio concurrency, without cross-test interference.
        run: cargo test --all -- --test-threads=1

      # The separate Futu API signer still uses Node's crypto implementation.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer policy tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
