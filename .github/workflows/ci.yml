name: CI

on:
  push:
    branches: [master, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # Subscriber-capture tests share tracing callsite state; each test still
        # exercises its own Tokio concurrency, without cross-test interference.
        run: cargo test --all -- --test-threads=1

      # The separate Futu API signer still uses Node's crypto implementation.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer policy tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  macos:
    needs: check
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true
      - name: Build locked release
        run: cargo build --release --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Verify executable and package deployment tools
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/codex-free"
          # Ad-hoc integrity only: CI never receives a local signing key.
          codesign --force --sign - --identifier local.example.codex-free.build "$binary"
          codesign --verify --all-architectures --strict "$binary"
          "$binary" --help > /dev/null
          python3 scripts/package-macos.py --target "$TARGET" --binary "$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Reruns for the same commit must not race their draft/upload steps.
    concurrency:
      group: release-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true
      - name: Package standalone deployment skill
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          target = Path('dist/codex-free-deploy-skill.zip')
          prefix = 'codex-free-macos-arm64/.agents/skills/'
          with zipfile.ZipFile('dist/codex-free-macos-arm64.zip') as source:
              names = sorted(n for n in source.namelist() if n.startswith(prefix + 'codex-free-deploy/'))
              assert {n[len(prefix):] for n in names} == {
                  'codex-free-deploy/SKILL.md',
                  'codex-free-deploy/agents/openai.yaml',
                  'codex-free-deploy/references/macos-signing.md',
              }, 'Unexpected deployment skill contents'
              with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED) as output:
                  for name in names:
                      info = source.getinfo(name)
                      info.filename = name[len(prefix):]
                      output.writestr(info, source.read(name))
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          target.with_suffix('.zip.sha256').write_text(digest + '  ' + target.name + '\n')
          PY
      - name: Publish completed build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
            if [[ "$head" != "$GITHUB_SHA" ]]; then
              echo "::notice::Source branch advanced; its newer build will publish instead."
              exit 0
            fi
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            kind=()
          else
            tag="build-${GITHUB_SHA:0:12}"
            kind=(--prerelease)
          fi
          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" == false ]]; then
            echo "Release already published; keeping its existing assets."
            exit 0
          fi
          cat > notes.md <<EOF
          Source commit: $GITHUB_SHA

          macOS build target: 13.0. Choose arm64 for Apple Silicon or x86_64 for Intel.
          Platform ZIPs include the executable, deployment scripts and codex-free-deploy skill.
          codex-free-deploy-skill.zip contains the standalone deployment skill only.
          Verify its SHA-256 sidecar before extracting. No private signing key or credentials are included.
          These builds are ad-hoc signed, without Apple notarization. Persistent installation uses your Mac's own keychain identity; OS permission confirmation may be required initially.
          EOF
          if [[ "$draft" != true ]]; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$tag" --notes-file notes.md --draft "${kind[@]}"
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" dist/* --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
